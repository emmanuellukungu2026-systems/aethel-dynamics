<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/logins.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Aethel Login</title>
</head>
<body>
    <div class="auth-page">
        <div class="top_back">
            <a href="{{ url_for('page_home') }}" aria-label="Back to home">
                <svg viewBox="0 0 512.016 512.016" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M271.094,368.925L158.176,256.007L271.093,143.09c6.101-6.101,7.936-15.275,4.629-23.253c-3.307-7.979-11.093-13.163-19.712-13.163H147.872c-5.717,0-11.179,2.283-15.168,6.336l-126.528,128c-8.235,8.32-8.235,21.675,0,29.995l126.528,128c3.989,4.053,9.451,6.336,15.168,6.336h108.139c8.619,0,16.405-5.184,19.712-13.163c3.307-7.979,1.472-17.152-4.629-23.253z"></path>
                </svg>
                <span>Home</span>
            </a>
        </div>

        <aside class="top_form">
            <img class="logo_aethel" width="70" src="{{ url_for('static', filename='logos/aethel_logo_nobg.png') }}" alt="Aethel logo">
            <p class="eyebrow">Welcome back</p>
            <h1>Log in to Aethel</h1>
        </aside>

        <main class="form_container">
            <form action="{{ url_for('main_page') }}" method="get">
                <div class="input-box">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username">
                </div>

                <div class="input-box">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                </div>

                <div class="acceptance">
                    <input type="checkbox" id="acceptance" name="remember_me">
                    <label for="acceptance">Remember me</label>
                </div>

                <button type="submit" class="button_submit">Login</button>

                <p class="form-footer">
                    Don’t have an account?
                    <a href="{{ url_for('signin_page') }}">Create one</a>
                </p>
            </form>
        </main>
    </div>
</body>
</html>
