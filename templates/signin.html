<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/logins.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Aethel Dynamics</title>
</head>
<body>
    <div class="top_back">
        <a href="{{ url_for('page_home') }}" class="btn btn-link p-0" aria-label="Back to home">
            <svg fill="#a68308" height="20px" width="20px" viewBox="0 0 512.016 512.016" xmlns="http://www.w3.org/2000/svg" stroke="#a68308" aria-hidden="true">
                <path d="M271.094,368.925L158.176,256.007L271.093,143.09c6.101-6.101,7.936-15.275,4.629-23.253c-3.307-7.979-11.093-13.163-19.712-13.163H147.872c-5.717,0-11.179,2.283-15.168,6.336l-126.528,128c-8.235,8.32-8.235,21.675,0,29.995l126.528,128c3.989,4.053,9.451,6.336,15.168,6.336h108.139c8.619,0,16.405-5.184,19.712-13.163c3.307-7.979,1.472-17.152-4.629-23.253z"></path>
            </svg>
        </a>
    </div>
    <div class="top_form">
        <img style="filter: invert(1); margin-right: 20px;" class="logo_aethel" width="70" src="{{ url_for('static', filename='logos/aethel_logo_nobg.png') }}" alt="Background Image" class="logo-image">
        <h3>Creating your account</h3>
    </div>
    <div class="form_container">
        <form action="">
            <div class="input-box">
              <label for="username">Username</label> 
              <input type="text" id="username" placeholder="Enter your username">
            </div>
            <div class="input-box">
              <label for="email">Email</label> 
              <input type="email"id="email" placeholder="Enter your email"> 
            </div>

            <div class="input-box">
              <label for="password">Password</label> 
              <input type="password" id="password" placeholder="Enter your password"> 
            </div>
            <div class="input-box">
              <label for="confirm-password">Confirm Password</label> 
              <input type="password" id="confirm-password" placeholder="Confirm your password">
            </div>
            <div class="acceptance">
              <input type="checkbox" id="acceptance">
              <label for="acceptance">I accept the <b>terms and conditions</b></label>
            <a href="{{ url_for('main_page') }}" class="btn btn-primary button_submit">Sign Up</a>
            </div>            


        </form> 
                

    </div>
</body>
</html>
